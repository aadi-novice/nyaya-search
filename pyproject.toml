[project]
name = "nyaya"
version = "0.1.0"
description = "Nyaya Search: question answering over Supreme Court of India judgments, with checked citations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf==2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sentence-transformers>=3.3",
    "transformers>=4.51",
    # PyTorch has no 2.15.0 wheel on any cu12x index (checked 2026-11-12:
    # cu128 stops at 2.11.0, cu126 at 2.14.1). 2.14.1 from cu126 is the newest
    # CUDA 12.x build for cp312 / win_amd64.
    "torch==2.14.1",
    "openai>=1.50",
    "httpx>=0.27",
    "regex>=2024.9",
]

[project.optional-dependencies]
eval = ["bm25s>=0.2", "scipy>=1.14"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]
# kaggle/push.py: the Kaggle dataset, kernel and output helpers
# six: kaggle 2.2.5 imports it without declaring it
kaggle = ["kaggle>=2.2", "six>=1.16"]
# nyaya-eval ragas: LLM-judged RAGAS metrics beside our own checks. Not in the
# CI install line; the tests skip without it. See [tool.uv] below for the
# jiter and rich overrides it needs.
ragas = ["ragas==0.4.3"]

[project.scripts]
nyaya-build = "nyaya.build:main"
nyaya-api = "nyaya.api.app:main"
nyaya-eval = "nyaya.eval.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# PyTorch from PyPI on Windows is CPU-only, so torch comes from the PyTorch
# CUDA index. The design names pytorch-cu128, but that index has no wheel for
# a torch release newer than 2.11.0; cu126 is the newest cu12x index with a
# current wheel (torch 2.14.1).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# Linux (CI on GitHub-hosted runners, which have no GPU) takes the CPU build
# from the PyTorch CPU index instead: the same torch version, without the
# multi-gigabyte CUDA wheels. Windows (the author's RTX 2060) is unchanged.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ragas 0.4.3 depends on instructor, whose newest release (1.17.0) caps
# jiter<0.15 and rich<15. Left alone, uv would downgrade openai (3.49 -> 3.3),
# jiter and rich for every install, extras or not. The overrides keep the base
# environment as it was; instructor only parses JSON with jiter and prints with
# rich, and the ragas tests pass with the newer versions.
[tool.uv]
override-dependencies = ["jiter>=0.6.1", "rich>=13.7.0"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["nyaya"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The research scripts stay unchanged (design, "Ground rules").
extend-exclude = ["scripts", "obsidian-vault", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
# test data deliberately holds curly quotes and dashes
"tests/**" = ["RUF001"]
