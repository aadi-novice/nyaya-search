# Every tunable value in Nyaya Search. No code writes this file.
# build/bands.json (written by `nyaya-build calibrate`) is merged over the
# [bands] defaults by load_settings(), and its hash suffixes versions.config.

snapshot_date = 2026-11-11

running_head_patterns = ["SUPREME COURT REPORTS", "Digital Supreme Court Reports"]

notices = [
    "This is not legal advice.",
    "Later overruling of a judgment is not tracked.",
    "Your question is sent to a hosted language model.",
    "Judgments may cite the IPC, CrPC or Indian Evidence Act, which were replaced by the BNS, BNSS and BSA from 1 July 2024.",
]

[paths]
tar_root = "docs/data/tar"
metadata_root = "docs/metadata/parquet"
build = "build"

[versions]
clean_text = "ct1"
chunker = "ch4"  # ch4 (2026-11-13): OCR specks before paragraph numbers; ch3: longest in-order paragraph sequence, long Held points split; ch2: Era C title-case Held
config = "cfg1"
prompt = "answer_v1"

[calibrate]
sample_size = 50
min_era_c = 40
seed = 42

# Empty until filled from build/bands.json. Each band is [low, high].
[bands]
top_y = []
bottom_y = []

[bands.era_c]
left_x = []
right_x = []

[era_markers.d]
labels = [
    "Issue for Consideration",
    "Headnotes",
    "Case Law Cited",
    "List of Acts",
    "List of Keywords",
]
# 2 (was 3), 2026-11-13: long 2024-2026 headnotes push the last three labels
# past page 3, and the late-2023 "CASE DETAILS" volumes print only "Issue for
# consideration" and "HEADNOTES". In an 80-per-year sample no 2010-2023 Era C
# judgment showed any label, so 2 cannot pull in Era C.
min_count = 2

[era_markers.c]
margin_line_regex = '^\s*[A-H]\s*$'
# 3 (was 5), 2026-11-13: OCR of some 2010-2016 scans joins margin letters to
# the body line, leaving 3-4 lone letters on the first pages (15% of a 2015
# sample). HELD and the year window still have to match.
min_margin_lines = 3
held_regex = 'HELD\s*:'
year_from = 2010
year_to = 2023

[chunk]
target_words = 400
min_words = 80
max_words = 700
abbreviations = [
    "J.", "JJ.", "v.", "vs.", "Ors.", "Anr.", "No.", "Sr.", "Adv.", "i.e.",
    "e.g.", "viz.", "s.", "ss.", "r.", "rr.", "Art.", "Arts.", "para.", "paras.",
]

[opinion]
phrase_window_chars = 300

# Priority order: dissenting first, then concurring.
[opinion.phrases]
dissenting = ["I regret I am unable to agree", "unable to agree", "beg to differ", "dissent"]
concurring = ["I agree", "concurring"]

[acts]
alias_file = "config/act_aliases.toml"
no_year_allowlist = ["Constitution of India"]

[quote]
min_words = 8
max_words = 40

[embed]
model = "Qwen/Qwen3-Embedding-0.6B"
revision = "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"  # Hugging Face commit, pinned 2026-11-13
dim = 1024
query_prefix = "Instruct: Given a legal research question, retrieve Supreme Court judgment passages that answer it\nQuery: "

# The challenger compared by scripts/select_models.py and embedded on Kaggle
# (kaggle/embed_corpus.py). To switch the build and the API to it, copy its
# name, revision, dim and query_prefix over the four [embed] values above.
[embed.alternatives."BAAI/bge-m3"]
revision = "5617a9f61b028005a4858fdac845db406aefb181"  # Hugging Face commit, pinned 2026-11-13
dim = 1024
query_prefix = ""  # bge-m3 dense retrieval takes no query instruction

[rerank]
model = "Qwen/Qwen3-Reranker-0.6B"
revision = "e61197ed45024b0ed8a2d74b80b4d909f1255473"  # Hugging Face commit, pinned 2026-11-13
instruction = "Given a legal research question, judge whether this Supreme Court judgment passage helps answer it"
fallback_model = "cohere/rerank-5-fast"

# Local encoder run-time settings (RTX 2060, 6 GB).
[encoders]
rerank_batch_size = 4     # pairs per reranker forward pass; keeps long chunks inside 6 GB VRAM
embed_batch_size = 16     # chunks per embedder forward pass during nyaya-build embed
max_tokens = 8000         # G6 over_model_limit: embedded text longer than this fails the gate

[retrieval]
keyword_k = 50
vector_k = 50
rrf_k = 60
rerank_candidates = 50  # 100 took ~7.4 s on the RTX 2060 (decision 2026-11-13)
final_k = 8
ef_search = 100
expand_rank_offset = 0.5
lookup_max_editorial = 3

# Seed values only: the refusal gate reads the active index_versions row.
[refusal]
threshold_qwen = 0.35
threshold_cohere = 0.20
max_wrong_refusal_share = 0.10

[llm]
max_input_tokens = 6000
# 1200 (was 800) and reasoning effort "low", 2026-11-13: gpt-oss-120b on Groq
# spends its budget on reasoning at the default effort, and Groq then rejects
# the cut-off JSON (HTTP 400 "Failed to validate JSON"). Measured on a real
# prompt: low effort used 366-763 completion tokens (97-461 of them reasoning).
max_output_tokens = 1200
reasoning_effort = "low"
repair_min_seconds_left = 4

[timeouts]
request_s = 30
llm_s = 12
answer_deadline_s = 15

[load]
smoke_min_hits = 8

[g6]
min_paragraph_integrity = 0.98
min_size_compliance = 0.99
holdout_size = 50
holdout_seed = 4242

[g4]
max_drop_points = 5.0

[devset]
size = 300
handcheck_size = 50
unanswerable_size = 40
max_shared_words = 5
seed = 11

[judge]
min_kappa = 0.6
min_hand_labels = 30        # judge-validate refuses to report a pass on fewer
prompt = "judge_v1"         # prompts/judge_v1.md
max_output_tokens = 600
reasoning_effort = ""       # e.g. "low" for a reasoning judge model; "" sends nothing
timeout_s = 30
rpm = 20                    # pacing for the free tier; 429s back off as in [answers]

[bm25_trigger]
min_gap_points = 3.0

[eval]
bootstrap_samples = 10000
seed = 7

[latency]
p95_target_s = 15.0
query_count = 30   # the first 30 questions of the set, by id
warmup = 2         # requests run first, not counted

# nyaya-eval answers (Phase 3)
[answers]
min_supported_share = 0.90             # G2
min_unanswerable_refused_share = 0.80  # G5 (the wrong-refusal limit is refusal.max_wrong_refusal_share)
llm_rpm = 20             # answer-LLM pacing for the free tier
rate_limit_retries = 6   # 429 retries before the run stops (resume later)
backoff_base_s = 5.0     # doubled per retry; a Retry-After header can lengthen it
backoff_max_s = 120.0

[lawyer]
sample_size = 30
seed = 13

[build]
max_error_share = 0.01

[encoder_check]
min_cosine = 0.999

# disposal_nature (trimmed) -> outcome. Anything not listed, including the
# empty value, maps to `default`.
[outcome_map]
default = "other"

[outcome_map.values]
allowed = ["Appeal(s) allowed", "Case Allowed", "Case Partly allowed", "Leave Granted & Allowed"]
dismissed = [
    "Dismissed",
    "Dismissed After",
    "Rejected",
    "Leave Granted & Dismissed",
    "Dismissed not complying condition order",
]
disposed = ["Disposed off", "Leave Granted & Disposed off", "IA disposed", "Decided Case"]
directions = [
    "Directions issued",
    "Remitted to Lower Court",
    "Transferred to High Court",
    "Modified",
    "Order modified",
]
referred = ["Matter referred to larger bench", "Reference answered"]
